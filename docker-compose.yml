version: "3.9"

# Optional local Docker Compose setup for Al-Quds AI Academic Advisor.
# NOTE: Ollama remains bound strictly to 127.0.0.1 (localhost) and is never exposed publicly.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    Working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-m3}
      - SQLITE_DB_PATH=/workspace/backend/data/alquds_catalog.db
      - CHROMA_PERSIST_DIR=/workspace/backend/data/chroma_index
    ports:
      - "127.0.0.1:8000:8000"
